<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雷射追蹤儀期間查核</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12202e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="追蹤儀查核">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{--bg:#eef2f6;--card:#fff;--ink:#12202e;--mut:#5b6773;--line:#d5dde5;--pri:#1f5fbf;--ok:#1a9c5b;--warn:#b98400;--bad:#d43c3c;--okb:#e5f6ed;--warnb:#fdf3d6;--badb:#fde8e6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header.top{background:#12202e;color:#fff;padding:12px 16px}
header.top h1{margin:0;font-size:18px;font-weight:650}
header.top p{margin:2px 0 0;font-size:12px;color:#aebccb}
nav#tabs{display:flex;gap:4px;overflow-x:auto;background:#1b2c3d;padding:6px 10px;position:sticky;top:0;z-index:20}
nav#tabs button{flex:none;border:0;background:transparent;color:#c5d0dc;padding:8px 12px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
nav#tabs button.on{background:#fff;color:var(--ink);font-weight:650}
main{max-width:1180px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14px;margin:16px 0 8px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.measGrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
.measGrid .card{margin:0}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
input[type=text],input[type=date],select{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid #b9c4cf;border-radius:8px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
input.err{border-color:var(--bad);background:var(--badb)}
label.chk{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:15px;padding:8px 0;border-bottom:1px solid #edf1f5;margin:0}
label.chk input{width:22px;height:22px;flex:none;margin-top:2px}
label.chk small{display:block;color:var(--mut);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:42px}
.btn.ghost{background:#fff;color:var(--pri)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn.file{margin:0;font-size:15px;position:relative}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row.between{justify-content:space-between;margin-top:0}
.muted{color:var(--mut);font-size:13px}
.pad{padding:20px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid #e3e9ef;text-align:left;vertical-align:middle}
.tbl thead th{font-size:12px;color:var(--mut);font-weight:600;background:#f5f8fa}
.tbl.kv th{width:42%;color:var(--mut);font-weight:500}
.tbl.kv.two th{width:18%}
.tbl.coord td{padding:3px}
.tbl.coord input{margin:0;padding:6px}
td.ok{color:var(--ok);font-weight:650}td.bad{color:var(--bad);font-weight:650}
.scroll{overflow-x:auto}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;margin:6px 6px 0 0}
.tag.ok{background:var(--okb);color:#0d6b3c}.tag.warn{background:var(--warnb);color:#7a5600}.tag.bad{background:var(--badb);color:#a32620}
.tag.front{background:#e3edfc;color:#1b4fa3}.tag.back{background:#fdebd9;color:#9a4d06}
ul.miss{margin:8px 0;padding-left:20px;color:#7a5600}
ol.steps{padding-left:20px;margin:0}
.illusWrap{text-align:center;margin-top:8px}
.illus{width:150px;height:auto;display:block;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chips.sm{padding:0}
.chip{flex:none;border:1px solid #b9c4cf;background:#fff;border-radius:10px;padding:6px 12px;font:inherit;font-weight:650;cursor:pointer;color:var(--ink);text-align:center;min-width:64px}
.chip small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.chip.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.chip.ok{background:var(--okb)}.chip.bad{background:var(--badb)}
.view3d{position:relative;background:linear-gradient(#dfe8f0,#f4f7fa);border:1px solid var(--line);border-radius:12px;height:440px;overflow:hidden;touch-action:none}
.view3d.tall{height:500px;margin-top:10px}
.view3d canvas{display:block}
.hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--mut);background:rgba(255,255,255,.8);padding:2px 8px;border-radius:6px;pointer-events:none;z-index:2}
.stepHead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stepNow{background:#f2f6fb;border-left:4px solid var(--pri);border-radius:6px;padding:10px 12px;margin:10px 0}
.stepNow p{margin:4px 0}
ol.stepList{margin:14px 0 0;padding-left:22px;font-size:13px;color:var(--mut)}
ol.stepList li{cursor:pointer;padding:1px 0}
ol.stepList li.on{color:var(--pri);font-weight:700}
ol.stepList li.done{color:#93a1ae;text-decoration:line-through}
.seg{display:inline-flex;border:1px solid var(--pri);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--pri);padding:7px 12px;font:inherit;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.meter{display:inline-block;width:70px;height:8px;background:#e3e9ef;border-radius:4px;overflow:hidden;vertical-align:middle}
.meter i{display:block;height:100%}
.meter i.ok,.dot.ok{background:var(--ok)}.meter i.warn,.dot.warn{background:#d9a100}.meter i.bad,.dot.bad{background:var(--bad)}
.verdict{border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.verdict b{font-size:22px}
.verdict.ok{background:var(--okb);color:#0d6b3c}.verdict.bad{background:var(--badb);color:#a32620}.verdict.warn{background:var(--warnb);color:#7a5600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{display:block;color:var(--mut);font-size:12px}
.kpi b{font-size:24px}
.kpi.ok b{color:var(--ok)}.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.shell{background:rgba(143,163,181,.35);border:1px solid #8fa3b5}
.chart{width:100%;min-width:640px;height:auto;display:block}
.chart .ct{font-size:12px;fill:var(--mut)}
.chart .ax{font-size:10px;fill:var(--mut)}
.chart .ax.grp{font-size:11px;fill:var(--ink);font-weight:600}
.chart .gl{stroke:#e3e9ef}.chart .sep{stroke:#cfd8e1;stroke-dasharray:3 3}
.chart .band{fill:#e9eef3}.chart .lim{stroke:#7b8794;stroke-width:1.5}
.chart .stem{stroke-width:2}
.chart .pt.ok,.chart .stem.ok{fill:var(--ok);stroke:var(--ok)}
.chart .pt.warn,.chart .stem.warn{fill:#d9a100;stroke:#d9a100}
.chart .pt.bad,.chart .stem.bad{fill:var(--bad);stroke:var(--bad)}
.chart .trend{stroke:var(--pri);stroke-width:2}
.report{background:#fff;border:1px solid var(--line);border-radius:4px;padding:28px;margin-top:12px}
.report header{border-bottom:3px solid var(--ink);margin-bottom:14px}
.report h1{margin:0;font-size:22px}
.report header p{margin:2px 0 10px;color:var(--mut);font-size:13px}
.report h2{font-size:15px;margin:20px 0 6px;border-left:4px solid var(--ink);padding-left:8px}
.report .tbl{font-size:12.5px}
.fn{font-size:12px;color:var(--mut)}
ul.fn{padding-left:18px}
.sign{display:flex;gap:20px;margin-top:36px}
.sign span{flex:1;border-top:1px solid var(--ink);padding-top:6px;font-size:13px}
@media(max-width:820px){
  .grid2,.measGrid{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .view3d{height:330px}.view3d.tall{height:380px}
  .report{padding:14px;overflow-x:auto}
  .tbl.kv.two th{width:auto}
}
@media print{
  header.top,nav#tabs,.noprint{display:none!important}
  body{background:#fff;font-size:11px}
  main{padding:0;max-width:none}
  .report{border:0;padding:0;margin:0}
  .report h2{break-after:avoid}
  tr{break-inside:avoid}
  .verdict{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* 第二版：通用 3D 模型、氣泡尺、靶心圖、介面細修 */
header.top{display:flex;align-items:center;gap:12px;border-bottom:3px solid #1f8a8a}
header.top:before{content:"";width:28px;height:28px;border-radius:50%;border:3px solid #1f8a8a;box-shadow:inset 0 0 0 5px #12202e,inset 0 0 0 8px #e5352b;flex:none}
nav#tabs button.done:after{content:"✓";margin-left:6px;color:#3ecf8e;font-weight:700}
nav#tabs button.on.done:after{color:var(--ok)}
.card{box-shadow:0 1px 2px rgba(18,32,46,.05)}
h2{letter-spacing:.02em}
.model3d{position:relative;height:300px;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 50% 40%,#fff,#e3eaf1);overflow:hidden;touch-action:none;margin:6px 0 10px}
.model3d .hint{left:50%;transform:translateX(-50%);white-space:nowrap}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.photos figure{margin:0;text-align:center}
.photos img{display:block;width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin-bottom:4px}
.how{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mut);margin-bottom:10px}
.how i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}
.pcards{display:grid;gap:10px}
.pcard{border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:10px 14px}
.pcard.fail{border-left-color:var(--bad)}
.pcard h3{margin:0;color:var(--ink);font-size:15px}
.pcard h3 .muted{font-weight:400}
.pcard h4{margin:8px 0 6px;font-size:12px;color:var(--mut);font-weight:600}
.pc2{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}
.g{margin-bottom:6px}
.gt,.b{font-variant-numeric:tabular-nums}
.gt{display:flex;gap:10px;font-size:13px;align-items:baseline}
.gt b{min-width:86px}
.gt span:last-child{margin-left:auto;font-weight:700}
.gsvg{width:100%;max-width:340px;display:block}
.gout{fill:#f6d9d6}.gin{fill:#e6f3ec}.glim{stroke:#39424c;stroke-width:2}.gzero{stroke:#7b8794;stroke-width:1.2;stroke-dasharray:2 2}
.gx{font-size:8px;fill:var(--mut)}
.gb{stroke:#fff;stroke-width:2}
.gb.ok,.bf.ok{fill:var(--ok)}.gb.warn,.bf.warn{fill:#d9a100}.gb.bad,.bf.bad{fill:var(--bad)}
span.ok{color:var(--ok)}span.warn{color:var(--warn)}span.bad{color:var(--bad)}
.bulls{display:flex;gap:10px;justify-content:space-around}
.b{display:flex;flex-direction:column;align-items:center;font-size:13px;line-height:1.35}
.b span:nth-of-type(2){font-weight:700}
.b small{color:var(--mut);font-size:11px}
.bsvg{width:84px;height:84px}
.bbg{fill:#f4f7fa}.bf{opacity:.88}.bhalf{fill:none;stroke:#b5c0cb;stroke-dasharray:2 2}.blim{fill:none;stroke:#39424c;stroke-width:2.5}.bx{stroke:#c5d0dc;stroke-width:.8}
@media(max-width:820px){.pc2{grid-template-columns:1fr}.model3d{height:260px}}
@media(max-width:820px){header.top p{display:none}}

/* 第三版 */
label.chk.all{background:#eef4fb;border-radius:8px;padding:10px;margin-top:8px;border:1px solid #c9d8ea;font-weight:600}
.grid2.tight{gap:10px}
.modal{position:fixed;inset:0;background:rgba(18,32,46,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:#fff;border-radius:12px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mbox p{margin:0 0 6px;font-size:15px}
.row.end{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#12202e;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.toast.bad{background:#a32620}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav#tabs{top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#12202e}
:root{color-scheme:light}
body.repfile{background:#fff}
body.repfile main{max-width:1000px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 第四版：雙面誤差＝兩個彈孔 */
.tgt{fill:#f4f7fa;stroke:#39424c;stroke-width:2.5}
.tgt.out{fill:#fdeceb;stroke:var(--bad)}
.hl{stroke-width:2}.hl.ok{stroke:var(--ok)}.hl.warn{stroke:#d9a100}.hl.bad{stroke:var(--bad)}
.hf{fill:#2f6fde;stroke:#fff;stroke-width:1.5}.hb{fill:#e07b1a;stroke:#fff;stroke-width:1.5}
.hlegend{font-size:12px;color:var(--mut);margin:6px 0 0}
.hlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 8px;vertical-align:-1px}
.hlegend i:first-child{margin-left:0}
.hlegend i.hf{background:#2f6fde}.hlegend i.hb{background:#e07b1a}
.magrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mut)}
.magrow input[type=range]{flex:1;min-width:140px;accent-color:var(--pri)}
.magrow b{color:var(--ink);font-variant-numeric:tabular-nums;min-width:64px}
.seglg{display:inline-flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-bottom:4px}
.seglg i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:5px;vertical-align:2px}
</style>
</head>
